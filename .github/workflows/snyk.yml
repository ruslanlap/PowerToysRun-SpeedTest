name: snyk

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security:
    runs-on: windows-latest
    env:
      SNYK_PROJECTS: |
        tests/Community.PowerToys.Run.Plugin.Templates.Tests.csproj

    steps:
      - uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore Templates.sln

      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Test and monitor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = $env:SNYK_PROJECTS -split "\r?\n" |
            Where-Object { $_ }

          foreach ($project in $projects) {
            snyk test --file=$project --package-manager=nuget
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            snyk monitor --file=$project --package-manager=nuget
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
